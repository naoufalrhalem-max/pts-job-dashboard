<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>PTS Jobs Dashboard - September 9, 2026</title>
<style>
  :root {
    --bg:#ffffff; --panel:#f8fafc; --panel2:#eef2f7; --border:#d8e0ea;
    --text:#0f172a; --muted:#64748b; --accent:#0284c7; --accent2:#d97706;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:Segoe UI,Roboto,Arial,sans-serif;padding:20px}
  .wrap{max-width:1280px;margin:0 auto}
  header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;padding:8px 0 18px;border-bottom:1px solid var(--border);margin-bottom:18px}
  h1{font-size:24px;font-weight:700}
  h1 small{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:4px}
  .controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .controls label{font-size:13px;color:var(--muted)}
  select,input[type=text]{background:#ffffff;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 10px;font-size:13px}
  select:focus,input:focus{outline:1px solid var(--accent)}
  .chip{background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:12px;display:none;align-items:center;gap:8px}
  .chip.show{display:inline-flex}
  .chip button{background:none;border:none;color:var(--accent2);cursor:pointer;font-size:14px}
  .mapbox{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;gap:18px;flex-wrap:wrap}
  .mapwrap{flex:1 1 760px;min-width:0}
  svg{width:100%;height:auto;display:block}
  .state{stroke:#ffffff;stroke-width:.6;cursor:pointer;transition:opacity .15s}
  .state:hover{stroke:var(--accent2);stroke-width:1.6}
  .state.sel{stroke:var(--accent2);stroke-width:2}
  .legend-side{flex:0 0 260px}
  .lg-title{font-size:13px;font-weight:700;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .lg-item{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
  .lg-dot{width:11px;height:11px;border-radius:3px;flex:none}
  .lg-item .cnt{margin-left:auto;color:var(--muted)}
  .lg-scale{display:flex;align-items:center;gap:6px;margin-top:14px;font-size:11px;color:var(--muted)}
  .lg-gradient{flex:1;height:12px;border-radius:3px;background:linear-gradient(90deg,#dbeafe,#60a5fa,#2563eb,#1e40af)}
  .tip{position:absolute;pointer-events:none;background:#ffffff;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:12px;min-width:190px;box-shadow:0 6px 20px rgba(15,23,42,.18);z-index:30;display:none;color:var(--text)}
  .tip h4{font-size:13px;margin-bottom:6px}
  .tip .t-total{color:var(--accent);font-weight:700}
  .tip .t-row{display:flex;align-items:center;gap:6px;padding:2px 0}
  .tip .t-dot{width:8px;height:8px;border-radius:2px;flex:none}
  .tip .t-cnt{margin-left:auto;font-weight:600}
  .tip .t-bar{height:3px;border-radius:2px;margin-top:2px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  .thead th{position:sticky;top:0;background:var(--panel2);text-align:left;padding:9px 10px;border-bottom:2px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap}
  .thead th:hover{color:var(--accent)}
  tbody tr{border-bottom:1px solid var(--border);cursor:pointer}
  tbody tr:hover{background:#f1f5f9}
  td{padding:9px 10px;vertical-align:top}
  a.offer{color:var(--accent);text-decoration:none;font-weight:600}
  a.offer:hover{text-decoration:underline}
  .tag{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600}
  .tag-permanent{background:#dcfce7;color:#166534}
  .tag-temp{background:#fef3c7;color:#92400e}
  .tag-temptoperm{background:#dbeafe;color:#1e40af}
  .remote-flag{color:#059669;font-weight:600}
  .remote-off{color:#94a3b8}
  .det-row{display:none}
  .det-row.open{display:table-row}
  .det-cell{background:#f8fafc;padding:12px 14px;font-size:12.5px;line-height:1.5;color:#334155;border-bottom:1px solid var(--border)}
  .det-cell .lbl{color:var(--muted);font-weight:700}
  .statusbar{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin:12px 0 6px}
  .clearfill{background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
  .clearfill:hover{color:var(--text)}
  .section-title{font-size:17px;font-weight:700;margin:26px 0 4px}
  .hint{font-size:12px;color:var(--muted);margin-bottom:10px}
  .details-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer}
  .details-btn:hover{color:var(--text);border-color:var(--accent)}
</style>
</head>

stateSel.innerHTML = '<option value="">All states</option>' + states.map(s=>`<option value="${s}">${s}</option>`).join("");

// ---------- state level aggregation ----------
let byState = {};
let maxState = 1;
function currentJobs(){
  return catFilter ? jobs.filter(j=>j.s===catFilter) : jobs;
}
function buildByState(list){
  const b = {};
  for (const j of list){
    if (!b[j.st]) b[j.st] = {total:0, s:{}, ct:{}};
    const s = b[j.st];
    s.total++;
    s.s[j.s] = (s.s[j.s]||0)+1;
    s.ct[j.ct] = (s.ct[j.ct]||0)+1;
  }
  return b;
}

// ---------- color scale ----------
function stateColor(v){
  if (!v) return "#e2e8f0";
  const t = Math.pow(v/maxState, 0.6);
  const stops = [[0.0,[219,234,254]],[0.25,[147,197,253]],[0.55,[96,165,250]],[0.8,[37,99,235]],[1.0,[30,58,138]]];
  let c = stops[0][1];
  for (let i=0;i<stops.length-1;i++){
    if (t>=stops[i][0] && t<=stops[i+1][0]){
      const f=(t-stops[i][0])/((stops[i+1][0]-stops[i][0])||1);
      const a=stops[i][1], b=stops[i+1][1];
      c=[Math.round(a[0]+(b[0]-a[0])*f),Math.round(a[1]+(b[1]-a[1])*f),Math.round(a[2]+(b[2]-a[2])*f)];
      break;
    }
  }
  return "rgb("+c.join(",")+")";
}

function fillFor(st){
  const g = document.getElementById("grp").value;
  const mapId = g==="s" ? "s" : "ct";
  const order = g==="s" ? SPECIALTIES : CONTRACTS;
  return {g, mapId, order};
}

// ---------- map ----------
const ns = "http://www.w3.org/2000/svg";
const svg = document.getElementById("usmap");
const pathLookup = {};
for (const [st, d] of Object.entries(map.states)){
  const p = document.createElementNS(ns,"path");
  p.setAttribute("d",d); p.setAttribute("class","state");
  p.id = "st-"+st;
  p.setAttribute("data-st",st);
  p.setAttribute("fill", stateColor(byState[st]?byState[st].total:0));
  svg.appendChild(p);
  pathLookup[st]=p;
}

const tip = document.getElementById("tip");
function showTip(ev, st){
  const b = byState[st];
  if (!b) return;
  const cfg = fillFor();
  const cats = cfg.mapId==="s" ? SPECIALTIES : CONTRACTS;
  const src = cfg.mapId==="s" ? b.s : b.ct;
  let inner = `<span class="t-total">${b.total} jobs</span>`;
  const sorted = cats.filter(c=>src[c]).sort((a,z)=>src[z]-src[a]);
  for (const c of sorted){
    const pct = Math.round(src[c]/b.total*100);
    const col = cfg.mapId==="s"? PALETTE[SPECIALTIES.indexOf(c)] : PALETTE_CT[c];
    inner += `<div class="t-row"><span class="t-dot" style="background:${col}"></span><span>${c}</span><span class="t-cnt">${src[c]}</span></div><div class="t-bar" style="width:${pct}%;background:${col}"></div>`;
  }
  tip.innerHTML = `<h4>${st.replace("_"," ")}</h4>`+inner;
  tip.style.display="block";
  const mw = tip.offsetWidth+20, mh = tip.offsetHeight+20;
  let x = ev.clientX+14, y = ev.clientY+14;
  if (x+mw > innerWidth-10) x = ev.clientX-mw;
  if (y+mh > innerHeight-10) y = ev.clientY-mh;
  tip.style.left = x+"px"; tip.style.top = y+"px";
}
function hideTip(){ tip.style.display="none"; }

let selState = null;
function refreshMap(){
  byState = buildByState(currentJobs());
  maxState = Math.max(...Object.values(byState).map(b=>b.total), 1);
  document.getElementById("scaleMax").textContent = maxState;
  for (const [st,p] of Object.entries(pathLookup)){
    p.setAttribute("fill", stateColor(byState[st]?byState[st].total:0));
    p.classList.toggle("sel", selState===st);
  }
}
svg.addEventListener("mousemove", e=>{
  const t = e.target;
  if (t.id && t.id.startsWith("st-")) showTip(e, t.dataset.st);
  else hideTip();
});
svg.addEventListener("mouseleave", hideTip);
svg.addEventListener("click", e=>{
  const t = e.target;
  if (!(t.id && t.id.startsWith("st-"))) return;
  const st = t.dataset.st;
  selState = (selState===st) ? null : st;
  stateSel.value = selState || "";
  refreshMap();
  const chip = document.getElementById("chip");
  if (selState){ chip.classList.add("show"); document.getElementById("chipTxt").textContent = "State: "+selState; }
  else chip.classList.remove("show");
  renderTable();
});

// ---------- legend ----------
function renderLegend(){
  const cfg = fillFor();
  const cats = cfg.mapId==="s" ? SPECIALTIES : CONTRACTS;
  const list = document.getElementById("lgList");
  list.innerHTML = "";
  document.getElementById("lgTitle").textContent = cfg.g==="s"
    ? (catFilter ? "Specialty: "+catFilter : "Job specialty breakdown")
    : "Employment type breakdown";
  const jl = currentJobs();
  const src = {};
  if (cfg.g==="s"){
    for (const j of jl){ src[j.s]=(src[j.s]||0)+1; }
  } else {
    for (const c of CONTRACTS) src[c]=0;
    for (const j of jl) src[j.ct]++;
  }
  const tot = Object.values(src).reduce((a,b)=>a+b,0);
  const items = cats.filter(c=>src[c]).sort((a,z)=>src[z]-src[a]);
  for (const c of items){
    const col = cfg.mapId==="s"? PALETTE[SPECIALTIES.indexOf(c)] : PALETTE_CT[c];
    list.insertAdjacentHTML("beforeend", `<div class="lg-item" data-cat="${c}"><span class="lg-dot" style="background:${col}"></span><span>${c}</span><span class="cnt">${src[c]} (${Math.round(src[c]/tot*100)}%)</span></div>`);
  }
  list.querySelectorAll(".lg-item").forEach(el=>{
    el.style.cursor="pointer";
    el.addEventListener("click", ()=>{
      setCat(el.dataset.cat);
    });
    el.addEventListener("mouseenter", ()=>{ el.style.background="#f1f5f9"; });
    el.addEventListener("mouseleave", ()=>{ el.style.background="transparent"; });
  });
}

function setCat(cat){
  const g = document.getElementById("grp").value;
  if (g==="s"){
    catFilter = cat;
    specSel.value = cat;
    refreshMap();
    renderLegend();
  } else {
    ctFilter = cat;
  }
  renderTable();
}

document.getElementById("grp").addEventListener("change", ()=>{ catFilter=null; ctFilter=null; specSel.value=""; refreshMap(); renderLegend(); renderTable(); });
specSel.addEventListener("change", e=>{
  catFilter = e.target.value || null;
  sortKey = null;
  refreshMap();
  renderLegend();
  renderTable();
});
stateSel.addEventListener("change", e=>{
  selState = e.target.value || null;
  sortKey = null;
  refreshMap();
  const chip = document.getElementById("chip");
  if (selState){ chip.classList.add("show"); document.getElementById("chipTxt").textContent = "State: "+selState; }
  else chip.classList.remove("show");
  renderTable();
});

// ---------- salary formatting ----------
function fmtMoney(v, u){
  if (v==null) return "";
  const n = Number(v);
  if (u==="h") return "$"+n.toFixed(2)+"/hr";
  return "$"+Math.round(n).toLocaleString("en-US")+"/yr";
}
function fmtRange(mn,mx,u){
  if (mn==null) return "";
  if (mx==null || mx===mn) return fmtMoney(mn,u);
  return fmtMoney(mn,u)+" - "+fmtMoney(mx,u);
}

// ---------- table ----------
const COLS = [
  {key:"t", label:"Job Title", sortable:true},
  {key:"s", label:"Specialty", sortable:true},
  {key:"ct", label:"Contract", sortable:true},
  {key:"c", label:"City", sortable:true},
  {key:"st", label:"State", sortable:true},
  {key:"r", label:"Remote", sortable:true},
  {key:"_sal", label:"Pay", sortable:false},
  {key:"d", label:"Posted", sortable:true},
  {key:"_link", label:"", sortable:false},
];
let sortKey=null, sortDir=1;
let catFilter=null, ctFilter=null;

function theadHTML(){
  return COLS.map(c=>{
    const arrow = c.sortable && sortKey===c.key ? (sortDir===1?" &#9650;":" &#9660;") : "";
    const onclick = c.sortable ? `sortBy('${c.key}')` : "";
    return `<th onclick="${onclick}">${c.label}${arrow}</th>`;
  }).join("");
}
document.getElementById("thead").innerHTML = "<th>#</th>"+theadHTML();

function ctTag(ct){
  const cls = ct==="Permanent"?"tag-permanent":(ct==="Temp To Perm"?"tag-temptoperm":"tag-temp");
  return `<span class="tag ${cls}">${ct.replace("Temp To Perm","Temp-to-Perm")}</span>`;
}

function filterJobs(){
  const g = fillFor().g;
  const rows = [];
  for (let i=0;i<jobs.length;i++){
    const j = jobs[i];
    if (selState && j.st!==selState) continue;
    if (catFilter && j.s!==catFilter) continue;
    if (ctFilter && j.ct!==ctFilter) continue;
    rows.push([i, j]);
  }
  if (sortKey){
    const k = sortKey;
    rows.sort((a,b)=>{
      let av=bv=null;
      if (k==="t"){av=a[1].t.toLowerCase();bv=b[1].t.toLowerCase();}
      if (k==="s"){av=a[1].s;bv=b[1].s;}
      if (k==="ct"){av=a[1].ct;bv=b[1].ct;}
      if (k==="c"){av=(a[1].c||"").toLowerCase();bv=(b[1].c||"").toLowerCase();}
      if (k==="st"){av=a[1].st;bv=b[1].st;}
      if (k==="r"){av=a[1].r;bv=b[1].r;}
      if (k==="d"){av=a[1].d;bv=b[1].d;}
      let r = 0;
      if (av==null&&bv==null) r=0; else if (av==null) r=1; else if (bv==null) r=-1;
      else if (typeof av==="number"&&typeof bv==="number") r=av-bv;
      else r=String(av).localeCompare(String(bv));
      return r*sortDir;
    });
  }
  return rows;
}

function renderTable(){
  const g = fillFor().g;
  const rows = filterJobs().slice(0, 500);
  const tb = document.getElementById("tbody");
  tb.innerHTML = "";
  const frag = document.createDocumentFragment();
  rows.forEach(([i,j])=>{
    const tr = document.createElement("tr");
    tr.dataset.st = j.st;
    const esc = s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    const sal = fmtRange(j.mn,j.mx,j.u);
    tr.innerHTML =
      `<td style="color:#64748b">${i+1}</td>`+
      `<td>${esc(j.t)}<div style="margin-top:4px"><button class="details-btn">Details</button></div></td>`+
      `<td>${esc(j.s)}</td>`+
      `<td>${ctTag(j.ct)}</td>`+
      `<td>${esc(j.c)}</td>`+
      `<td>${esc(j.st)}</td>`+
      `<td class="${j.r?'remote-flag':'remote-off'}">${j.r?'Remote':'On-site'}</td>`+
      `<td>${sal}</td>`+
      `<td>${j.d}</td>`+
      `<td><a class="offer" href="${j.u}" target="_blank" rel="noopener">View offer &#8599;</a></td>`;
    tr.addEventListener("mouseenter", ()=>{
      const p = pathLookup[j.st];
      if (p) p.style.opacity="0.65";
    });
    tr.addEventListener("mouseleave", ()=>{
      const p = pathLookup[j.st];
      if (p) p.style.opacity="1";
    });
    tr.querySelector(".details-btn").addEventListener("click", ev=>{
      ev.stopPropagation();
      const dr = tr.nextElementSibling;
      if (dr && dr.classList.contains("det-row")){
        dr.classList.toggle("open");
        return;
      }
      const dtr = document.createElement("tr");
      dtr.className = "det-row open";
      dtr.innerHTML = `<td></td><td colspan="${COLS.length+1}" class="det-cell"><span class="lbl">Description : </span><br>${esc(j.de||"No description")}<br><br><a class="offer" href="${j.u}" target="_blank" rel="noopener">Open offer on randstadusa.com &#8599;</a></td>`;
      tr.after(dtr);
    });
    frag.appendChild(tr);
  });
  tb.appendChild(frag);
}

function sortBy(k){
  if (sortKey===k) sortDir*=-1; else { sortKey=k; sortDir=1; }
  document.getElementById("thead").innerHTML = "<th>#</th>"+theadHTML();
  renderTable();
}
function clearState(){
  selState=null;
  stateSel.value="";
  document.getElementById("chip").classList.remove("show");
  refreshMap(); renderTable();
}
function resetFilters(){
  selState=null; catFilter=null; ctFilter=null; sortKey=null;
  stateSel.value="";
  specSel.value="";
  document.getElementById("chip").classList.remove("show");
  refreshMap(); renderLegend(); renderTable();
}

renderLegend();
refreshMap();
renderTable();
</script>
</body>
</html>
